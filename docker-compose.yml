
services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: labvisit-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-labvisit}
      DB_USER: ${DB_USER:-labuser}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  db:
    image: postgres:16-alpine
    container_name: labvisit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-labvisit}
      POSTGRES_USER: ${DB_USER:-labuser}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: labvisit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: labvisit-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: labvisit_postgres_data
  redis_data:
    name: labvisit_redis_data

networks:
  frontend:
    name: labvisit_frontend
    driver: bridge
  backend:
    name: labvisit_backend
    driver: bridge
    internal: true

secrets:
  db_password:
    file: ./secrets/db_password.txt
